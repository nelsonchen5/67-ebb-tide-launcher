<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>67 Ebb Tide</title>

  <!-- Home-screen icon (real https URL — the only way an Apps Script app
       gets a custom My Melody icon). NO <link rel="manifest"> on purpose:
       a manifest start_url can override the added URL on a standalone iOS
       clip and strip ?who=. -->
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

  <!-- Standalone launch (full-screen icon, matches the original) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="67 Ebb Tide">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#FFF2F7">

  <!-- Instant redirect to the app, forwarding ?who=. (A thin Safari bar on
       the app screen is unavoidable: the app is cross-origin on
       script.google.com. Removing it would require hosting the UI on this
       origin as a PWA.) JS-only so ?who= is always carried. -->
  <script>
    (function () {
      var base = "https://script.google.com/macros/s/AKfycbzyMVykT3FJ6sWojn-qtTD0YyUwOv7zjp6NQAkyvalJw7wZ_Rzb-lPFs4uJGjrCdYtx/exec";
      location.replace(base + location.search);
    })();
  </script>

  <style>
    html,body{height:100%;margin:0}
    body{
      box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:14px;padding:32px;text-align:center;background:#FFF2F7;color:#5A3D4A;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    }
    img{width:120px;height:120px;border-radius:28px;box-shadow:0 12px 32px rgba(226,88,138,.30)}
    p{color:#B58AA0;font-size:14px;margin:0}
    a{color:#E0588A;font-weight:700;text-decoration:none}
  </style>
</head>
<body>
  <img src="icon-192.png" alt="67 Ebb Tide">
  <p>Opening 67 Ebb Tide…</p>
  <p><a id="go" href="https://script.google.com/macros/s/AKfycbzyMVykT3FJ6sWojn-qtTD0YyUwOv7zjp6NQAkyvalJw7wZ_Rzb-lPFs4uJGjrCdYtx/exec">Tap here if it doesn't open</a></p>
  <script>
    var go = document.getElementById('go');
    if (go && location.search) go.href = go.href + location.search;
  </script>
</body>
</html>
