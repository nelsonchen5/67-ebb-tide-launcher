<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>67 Ebb Tide</title>

  <!-- iOS home-screen icon (must be a real https URL, not a data: URI) -->
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- iOS standalone web-app behaviour -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="67 Ebb Tide">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#F3F4F6">

  <!-- Redirect to the live Google Apps Script web app.
       The home-screen icon is captured from THIS page at add-time,
       so launching it still shows the My Melody icon even though the
       app itself is hosted on script.google.com. -->
  <meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbzyMVykT3FJ6sWojn-qtTD0YyUwOv7zjp6NQAkyvalJw7wZ_Rzb-lPFs4uJGjrCdYtx/exec">
  <script>
    // JS redirect as the primary path; the meta refresh is a no-JS fallback.
    // Forward any query string (and #hash) so a per-person launcher works:
    //   .../67-ebb-tide-launcher/?who=nelson  ->  .../exec?who=nelson
    // The bare URL still lands on the in-app name picker.
    (function () {
      var base = "https://script.google.com/macros/s/AKfycbzyMVykT3FJ6sWojn-qtTD0YyUwOv7zjp6NQAkyvalJw7wZ_Rzb-lPFs4uJGjrCdYtx/exec";
      location.replace(base + location.search + location.hash);
    })();
  </script>

  <style>
    html,body{height:100%;margin:0}
    body{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:16px;background:#F3F4F6;color:#111827;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    }
    img{width:96px;height:96px;border-radius:22px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
    a{color:#6B7280}
  </style>
</head>
<body>
  <img src="icon-192.png" alt="67 Ebb Tide">
  <div>Opening 67 Ebb Tide…</div>
  <a id="go" href="https://script.google.com/macros/s/AKfycbzyMVykT3FJ6sWojn-qtTD0YyUwOv7zjp6NQAkyvalJw7wZ_Rzb-lPFs4uJGjrCdYtx/exec">Tap here if it doesn't open</a>
  <script>
    // Keep the manual-tap fallback in sync with any forwarded ?who=.
    var go = document.getElementById('go');
    if (go) go.href = go.href + location.search + location.hash;
  </script>
</body>
</html>
