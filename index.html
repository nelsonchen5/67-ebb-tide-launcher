<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>67 Ebb Tide</title>

  <!-- Home-screen icon (must be a real https URL, not a data: URI).
       This is the whole point of this page: it gives the app a custom
       My Melody home-screen icon, which an Apps Script URL can't set itself. -->
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="67 Ebb Tide">
  <meta name="theme-color" content="#FFF2F7">
  <!-- NOTE: intentionally NOT apple-mobile-web-app-capable. Standalone mode
       turns the cross-origin Apps Script app into an ugly chrome-less webview,
       so we let the icon open the app in normal Safari instead. -->

  <style>
    html,body{height:100%;margin:0}
    body{
      box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:18px;padding:32px;text-align:center;background:#FFF2F7;color:#5A3D4A;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    }
    img{width:132px;height:132px;border-radius:30px;box-shadow:0 12px 32px rgba(226,88,138,.30)}
    h1{font-size:22px;margin:2px 0 0;color:#E0588A}
    a.open{
      display:inline-block;margin-top:6px;background:#E0588A;color:#fff;font-weight:700;
      text-decoration:none;padding:15px 30px;border-radius:999px;font-size:17px;
      box-shadow:0 8px 18px rgba(226,88,138,.35);
    }
    a.open:active{transform:translateY(1px)}
    p.hint{color:#B58AA0;font-size:13px;max-width:300px;line-height:1.55;margin:6px 0 0}
  </style>
</head>
<body>
  <img src="icon-192.png" alt="67 Ebb Tide">
  <h1>67 Ebb Tide</h1>

  <a class="open" id="go" href="https://script.google.com/macros/s/AKfycbzyMVykT3FJ6sWojn-qtTD0YyUwOv7zjp6NQAkyvalJw7wZ_Rzb-lPFs4uJGjrCdYtx/exec">Open 67 Ebb Tide</a>

  <p class="hint">First time here? Tap <b>Share</b> &#8593; &#8594; <b>Add to Home&nbsp;Screen</b> to keep this icon.</p>

  <script>
    // Forward a ?who= if one is present (harmless), otherwise just open the app.
    (function () {
      var go = document.getElementById('go');
      if (go && location.search) go.href = go.href + location.search;
    })();
  </script>
</body>
</html>
